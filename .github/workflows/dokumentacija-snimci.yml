name: Dokumentacija snimci

on:
  push:
    paths:
      - '.github/workflows/dokumentacija-snimci.yml'

jobs:
  snimci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalacija Playwright-a
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Snimanje finalnih prikaza
        run: |
          mkdir -p dokumentacija-snimci
          cat > snimci.js <<'JS'
          const { chromium } = require('playwright');
          const base = 'https://lazarmal.github.io/VD-Dubinsko-Pranje/';
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            const page = await context.newPage();

            await page.goto(base + 'o-nama.html', { waitUntil: 'domcontentloaded', timeout: 60000 });
            const video = page.locator('iframe[title="Primer dubinskog pranja nameštaja"]');
            await video.scrollIntoViewIfNeeded();
            await page.waitForTimeout(12000);
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(1200);
            await page.screenshot({ path: 'dokumentacija-snimci/02-o-nama-live-video.png', fullPage: true });

            await page.goto(base + 'kontakt.html', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(9000);
            await page.locator('#kontakt-forma button[type="submit"]').click();
            await page.waitForTimeout(1000);
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(1000);
            await page.screenshot({ path: 'dokumentacija-snimci/06-kontakt-validacija-live-fix.png', fullPage: true });

            await browser.close();
          })();
          JS
          node snimci.js
      - uses: actions/upload-artifact@v4
        with:
          name: dokumentacija-snimci-final
          path: dokumentacija-snimci/
          retention-days: 7
