name: Zameni promotivni video

on:
  push:
    paths:
      - '.github/workflows/zameni-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zameni-video:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorijum
        uses: actions/checkout@v4

      - name: Instaliraj FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Preuzmi pravi snimak sa Pexels-a
        run: |
          curl -L --fail --retry 3 \
            -A "Mozilla/5.0" \
            "https://www.pexels.com/download/video/4822914/" \
            -o /tmp/izvor.mp4

      - name: Pripremi kratak lokalni MP4
        run: |
          ffmpeg -y -i /tmp/izvor.mp4 \
            -t 12 \
            -vf "scale=1280:-2" \
            -c:v libx264 -preset medium -crf 27 \
            -an -movflags +faststart \
            video/dubinsko-pranje.mp4

      - name: Sačuvaj novi video u repozitorijum
        run: |
          git config user.name "LazarMal"
          git config user.email "lazarmalesev.9@gmail.com"
          git add video/dubinsko-pranje.mp4
          if git diff --cached --quiet; then
            echo "Video je već isti."
          else
            git commit -m "Zamenjen promotivni video pravim snimkom čišćenja"
            git push
          fi
