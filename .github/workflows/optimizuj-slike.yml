name: Optimizacija tri velike slike

on:
  push:
    paths:
      - '.github/workflows/optimizuj-slike.yml'

permissions:
  contents: write

jobs:
  optimizacija:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzimanje projekta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalacija Pillow biblioteke
        run: pip install pillow

      - name: Optimizacija tri JPG slike
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          fajlovi = [
              Path('slike/pranje-automobila.jpg'),
              Path('slike/pranje-namestaja.jpg'),
              Path('slike/iznajmljivanje-masine.jpg'),
          ]

          for putanja in fajlovi:
              pre = putanja.stat().st_size
              sa = Image.open(putanja)
              sirina, visina = sa.size
              rgb = sa.convert('RGB')
              rgb.save(
                  putanja,
                  format='JPEG',
                  quality=90,
                  optimize=True,
                  progressive=True
              )
              posle = putanja.stat().st_size
              procenat = (1 - posle / pre) * 100 if pre else 0
              print(f'{putanja}: {sirina}x{visina} | {pre/1024:.1f} KB -> {posle/1024:.1f} KB | smanjenje {procenat:.1f}%')
          PY

      - name: Cuvanje optimizovanih slika
        run: |
          if git diff --quiet -- slike/pranje-automobila.jpg slike/pranje-namestaja.jpg slike/iznajmljivanje-masine.jpg; then
            echo "Nema promena za commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slike/pranje-automobila.jpg slike/pranje-namestaja.jpg slike/iznajmljivanje-masine.jpg
          git commit -m "Optimizovane tri velike slike bez vidljive promene kvaliteta"
          git push
