name: Provera hostovanog sajta

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/provera-sajta.yml'

jobs:
  lighthouse-provera:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzimanje projekta
        uses: actions/checkout@v4

      - name: Provera dostupnosti hostovanog sajta
        run: |
          mkdir -p izvestaji
          curl -L -I --fail --silent --show-error "https://lazarmal.github.io/VD-Dubinsko-Pranje/" | tee izvestaji/http-zaglavlja.txt

      - name: Instalacija Lighthouse alata
        run: npm install -g lighthouse

      - name: Lighthouse desktop provera
        run: |
          lighthouse "https://lazarmal.github.io/VD-Dubinsko-Pranje/" \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --output=html \
            --output=json \
            --output-path="./izvestaji/lighthouse-desktop"

      - name: Lighthouse mobilna provera
        run: |
          lighthouse "https://lazarmal.github.io/VD-Dubinsko-Pranje/" \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --output=html \
            --output=json \
            --output-path="./izvestaji/lighthouse-mobile"

      - name: Kreiranje sazetka rezultata
        run: |
          python3 - <<'PY'
          import json, html
          from pathlib import Path
          from datetime import datetime, timezone

          folder = Path('izvestaji')
          def ucitaj(prefiks):
              kandidat = folder / f'{prefiks}.report.json'
              if not kandidat.exists():
                  kandidat = folder / f'{prefiks}.json'
              return json.loads(kandidat.read_text(encoding='utf-8'))

          desktop = ucitaj('lighthouse-desktop')
          mobile = ucitaj('lighthouse-mobile')

          def rezultat(podaci):
              kat = podaci['categories']
              return {
                  'Performance': round(kat['performance']['score'] * 100),
                  'Accessibility': round(kat['accessibility']['score'] * 100),
                  'Best Practices': round(kat['best-practices']['score'] * 100),
                  'SEO': round(kat['seo']['score'] * 100),
              }

          d = rezultat(desktop)
          m = rezultat(mobile)
          datum = datetime.now(timezone.utc).strftime('%d.%m.%Y. %H:%M UTC')
          url = 'https://lazarmal.github.io/VD-Dubinsko-Pranje/'

          def kartice(naslov, vrednosti):
              delovi = ''.join(
                  f'<div class="score"><strong>{v}</strong><span>{html.escape(k)}</span></div>'
                  for k, v in vrednosti.items()
              )
              return f'<section><h2>{naslov}</h2><div class="scores">{delovi}</div></section>'

          dokument = f'''<!doctype html>
          <html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Lighthouse rezultati - Dubinski Sjaj</title>
          <style>
          body{{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#202124}}
          main{{max-width:1180px;margin:0 auto;padding:48px}}
          .head{{background:#fff;padding:32px;border-radius:18px;box-shadow:0 2px 12px #0001;margin-bottom:28px}}
          h1{{margin:0 0 12px;font-size:34px}} p{{margin:6px 0;color:#5f6368}}
          section{{background:#fff;padding:28px 32px;border-radius:18px;box-shadow:0 2px 12px #0001;margin:20px 0}}
          h2{{margin-top:0}}
          .scores{{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}}
          .score{{border:1px solid #dadce0;border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:190px;margin:auto}}
          .score strong{{font-size:52px;font-weight:500}} .score span{{font-size:14px;margin-top:6px;color:#5f6368}}
          .note{{font-size:14px;color:#5f6368;margin-top:22px}}
          </style></head><body><main>
          <div class="head"><h1>Google Lighthouse provera hostovanog sajta</h1><p><strong>Sajt:</strong> {html.escape(url)}</p><p><strong>Datum testa:</strong> {datum}</p><p>Automatizovana provera pokrenuta preko GitHub Actions okruženja.</p></div>
          {kartice('Desktop', d)}
          {kartice('Mobilni uredjaj', m)}
          <p class="note">Detaljni originalni Lighthouse HTML i JSON izvestaji nalaze se u istom paketu sa rezultatima.</p>
          </main></body></html>'''

          (folder / 'lighthouse-rezime.html').write_text(dokument, encoding='utf-8')
          (folder / 'rezultati.txt').write_text(
              'Google Lighthouse - Dubinski Sjaj\n' +
              f'URL: {url}\nDatum: {datum}\n\n' +
              'Desktop: ' + ', '.join(f'{k} {v}' for k,v in d.items()) + '\n' +
              'Mobile: ' + ', '.join(f'{k} {v}' for k,v in m.items()) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Snimanje validnih screenshotova izvestaja
        run: |
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium || true)
          if [ -z "$CHROME" ]; then
            echo "Chrome nije pronadjen" >&2
            exit 1
          fi

          DESKTOP_HTML=$(find "$PWD/izvestaji" -maxdepth 1 -type f \( -name 'lighthouse-desktop.report.html' -o -name 'lighthouse-desktop.html' \) | head -n 1)
          MOBILE_HTML=$(find "$PWD/izvestaji" -maxdepth 1 -type f \( -name 'lighthouse-mobile.report.html' -o -name 'lighthouse-mobile.html' \) | head -n 1)

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1440,1800 --virtual-time-budget=5000 \
            --screenshot="$PWD/izvestaji/01-lighthouse-desktop.png" "file://$DESKTOP_HTML"

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1440,1800 --virtual-time-budget=5000 \
            --screenshot="$PWD/izvestaji/02-lighthouse-mobile.png" "file://$MOBILE_HTML"

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1440,1200 --virtual-time-budget=2000 \
            --screenshot="$PWD/izvestaji/03-lighthouse-rezime.png" "file://$PWD/izvestaji/lighthouse-rezime.html"

      - name: Cuvanje rezultata testa
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-rezultati
          path: izvestaji/
          retention-days: 30
